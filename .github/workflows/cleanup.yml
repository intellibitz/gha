name: GHA Cleanup & Maintenance Workflow

on:
  workflow_dispatch:
    inputs:
      cleanupAll:
        description: 'Whether to cleanup all completed workflow runs'
        required: true
        default: 'true'
      statusFilter:
        description: 'Filter runs by status (all, failed, cancelled, success)'
        required: true
        default: 'all'
  schedule:
    - cron: '0 0 * * 0' # Weekly cleanup on Sunday at midnight

jobs:
  cleanup:
    name: GitHub Actions Cleanup
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build & Publish Plugin to MavenLocal
        run: ./gradlew publishToMavenLocal

      - name: Run GHA Cleanup & Audit Tasks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --init-script init/gha.init.gradle.kts \
            ghaWorkflowCleanup -PcleanupAll=${{ github.event.inputs.cleanupAll || 'true' }} -PstatusFilter=${{ github.event.inputs.statusFilter || 'all' }} \
            ghaWorkflowList \
            ghaStatus
