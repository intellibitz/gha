name: "Security & Vulnerability Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Vulnerability & Secret Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java Toolchain
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Build & Publish Plugin to MavenLocal
      run: ./gradlew publishToMavenLocal --no-daemon

    - name: Execute GHA Security & Dependency Audit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew --no-daemon --init-script init/gha.init.gradle.kts ghaSecurityStatus ghaDependencies
