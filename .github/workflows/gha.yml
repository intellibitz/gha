name: GHA Automation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gha-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build & Publish Plugin to MavenLocal
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Run ghai Autonomous AI Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHA_NO_REFRESH: "1"
        run: |
          chmod +x gradlew ghai
          # Use ghai to verify itself, sweep PRs, and prune CI logs
          ./ghai :version
          ./ghai :status
          ./ghai --no-daemon
