name: GHA Automation Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-automate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build & Publish Plugin to MavenLocal
        run: ./gradlew publishToMavenLocal

      - name: Run GHA Automation Tasks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew --init-script init/gha.init.gradle.kts ghaInit ghaStatus ghaDependencies ghaGitStatus ghaGitLog ghaWorkflow
