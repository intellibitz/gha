[package]
name = "gha"
version = "0.1.2022632"
edition = "2024"
authors = ["IntelliBitz", "Muthu Ramadoss", "Gemini (Google AI)"]
description = "gha: EAI: Exponential Intelligence for Any AI. - GAWD, GEMI & GMCP Multi-Agent Engine"
license = "Apache-2.0"

[dependencies]
version = "0.1.2022632"
serde_json = "1.0"
version = "0.1.2022632"
version = "0.1.2022632"
version = "0.1.2022632"
tokenizers = "0.21.0"
hf-hub = "0.4.1"
anyhow = "1.0"
rustyline = "15.0"
version = "0.1.2022632"
wasmer-wasi = "3.1"
base64 = "0.22"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]

[profile.release]
opt-level = 3 # High performance
lto = "thin" # Faster parallel LTO
codegen-units = 256 # Saturate all 28 cores
incremental = true # Speed up iterative builds
panic = "abort"
strip = true
