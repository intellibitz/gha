[package]
name = "gha"
version = "0.1.89"
edition = "2021"
authors = ["IntelliBitz", "Muthu Ramadoss", "Gemini (Google AI)"]
description = "gha: Pure AI for AI Runtime — GAWD, GEMI & GMCP Multi-Agent Engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
