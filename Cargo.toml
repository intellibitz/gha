[package]
name = "gha"
version = "0.1.112"
edition = "2024"
authors = ["IntelliBitz", "Muthu Ramadoss", "Gemini (Google AI)"]
description = "gha: EAI: Exponential Intelligence for Any AI. - GAWD, GEMI & GMCP Multi-Agent Engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
candle-core = "0.8.2"
candle-nn = "0.8.2"
candle-transformers = "0.8.2"
tokenizers = "0.21.0"
hf-hub = "0.4.1"
anyhow = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
