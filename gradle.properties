# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official

# 100% Sandboxed Gradle User Home inside .gha/ folder
# All downloaded dependencies, Kotlin libraries, and JDK toolchains remain confined to .gha/
org.gradle.user.home=.gha/gradle-user-home

# Force Java Toolchain detection to strictly use .gha sandbox
org.gradle.java.installations.paths=.gha/gradle-user-home/jdks
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
